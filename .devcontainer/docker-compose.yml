services:
  app:
    image: mcr.microsoft.com/devcontainers/javascript-node:1-22-bookworm
    init: true
    network_mode: service:mongodb
    depends_on:
      mongodb:
        condition: service_healthy
    volumes:
      - ..:/workspaces/Projeto_Inter_AR:cached
    command: sleep infinity

  mongodb:
    image: mongo:8.0
    restart: unless-stopped
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - >-
          try {
            const s = rs.status();
            quit(s.ok === 1 && s.myState === 1 ? 0 : 1);
          } catch (e) {
            try {
              rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'localhost:27017' }] });
            } catch (_) {}
            quit(1);
          }
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 5s

volumes:
  mongo-data:
