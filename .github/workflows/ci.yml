name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_ENV: test
      PORT: 3000
      MONGO_URI: mongodb://127.0.0.1:27017/saas_ci?replicaSet=rs0
      JWT_SECRET: ci_test_secret_key_with_at_least_32_characters
      RATE_LIMIT_STORE: mongodb
      ALLOW_PUBLIC_MULTI_REGISTER: "false"
      ALLOW_DIRECT_PLAN_CHANGE: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: saas-app/package-lock.json

      - name: Start MongoDB replica set
        run: docker compose -f .devcontainer/docker-compose.yml up -d --wait mongodb

      - name: Install dependencies
        run: npm ci --prefix saas-app

      - name: Run unit and integration tests
        run: npm test --prefix saas-app

      - name: Run API end-to-end scripts
        run: npm run test:scripts --prefix saas-app

      - name: Stop MongoDB
        if: always()
        run: docker compose -f .devcontainer/docker-compose.yml down
